<svg viewBox="0 0 1680 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1680" height="900" fill="#FAFAF8"/>

  <text x="840" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#2B2A27">Blue Canopy Business Intelligence — High-Level Architecture</text>
  <text x="840" y="68" text-anchor="middle" font-size="16" fill="#5F5E5A">SQL Server medallion warehouse (Bronze / Silver / Gold) &#8594; Power BI semantic model &#8594; Dashboards</text>

  <!-- Column 1: Data Sources -->
  <rect x="30" y="100" width="260" height="750" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/>
  <rect x="30" y="100" width="260" height="46" rx="10" fill="#8A8778"/>
  <rect x="30" y="126" width="260" height="20" fill="#8A8778"/>
  <text x="160" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">OLTP DATA SOURCES</text>
  <text x="160" y="172" text-anchor="middle" font-size="14" fill="#5F5E5A">5 source systems</text>
  <text x="160" y="192" text-anchor="middle" font-size="14" fill="#5F5E5A">34 CSV files</text>

  <g font-size="15" fill="#2B2A27" font-weight="600">
    <rect x="48" y="212" width="224" height="42" rx="6" fill="#F0EFEA"/>
    <text x="60" y="238">CRM &amp; Loyalty (6)</text>
    <rect x="48" y="262" width="224" height="42" rx="6" fill="#F0EFEA"/>
    <text x="60" y="288">POS &amp; Ecommerce (5)</text>
    <rect x="48" y="312" width="224" height="42" rx="6" fill="#F0EFEA"/>
    <text x="60" y="338">Supply Chain &amp; Inventory (7)</text>
    <rect x="48" y="362" width="224" height="42" rx="6" fill="#F0EFEA"/>
    <text x="60" y="388">Stores &amp; HR (4)</text>
    <rect x="48" y="412" width="224" height="42" rx="6" fill="#F0EFEA"/>
    <text x="60" y="438">Marketing &amp; External (12)</text>
  </g>
  <text x="160" y="490" text-anchor="middle" font-size="13.5" fill="#8A8778">Python generators</text>
  <text x="160" y="508" text-anchor="middle" font-size="13.5" fill="#8A8778">(pandas, NumPy, Faker)</text>
  <text x="160" y="526" text-anchor="middle" font-size="13.5" fill="#8A8778">&#8594; raw CSVs</text>

  <path d="M 296 460 L 334 460" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 2: Bronze -->
  <rect x="338" y="100" width="260" height="750" rx="10" fill="#FFFFFF" stroke="#C9A876" stroke-width="2"/>
  <rect x="338" y="100" width="260" height="46" rx="10" fill="#B08D57"/>
  <rect x="338" y="126" width="260" height="20" fill="#B08D57"/>
  <text x="468" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">BRONZE LAYER</text>
  <text x="468" y="174" text-anchor="middle" font-size="14" fill="#5F5E5A">SQL Server &#183; raw data</text>

  <circle cx="468" cy="222" r="26" fill="#C9A876"/>

  <text x="468" y="276" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Purpose</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="356" y="300">&#8226; Audit trail / traceability</text>
    <text x="356" y="322">&#8226; Raw backup of source</text>
  </g>
  <text x="468" y="360" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Load</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="356" y="384">&#8226; Batch, full load</text>
    <text x="356" y="406">&#8226; No transformation</text>
  </g>
  <text x="468" y="444" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Object type</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="356" y="468">&#8226; Tables, as-received</text>
  </g>

  <path d="M 604 460 L 642 460" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 3: Silver -->
  <rect x="646" y="100" width="260" height="750" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/>
  <rect x="646" y="100" width="260" height="46" rx="10" fill="#8F8D87"/>
  <rect x="646" y="126" width="260" height="20" fill="#8F8D87"/>
  <text x="776" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">SILVER LAYER</text>
  <text x="776" y="174" text-anchor="middle" font-size="14" fill="#5F5E5A">SQL Server &#183; cleaned data</text>

  <circle cx="776" cy="222" r="26" fill="#B4B2A9"/>

  <text x="776" y="276" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Purpose</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="664" y="300">&#8226; Reliable foundation for</text>
    <text x="674" y="320">downstream analytics</text>
  </g>
  <text x="776" y="358" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Transformations</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="664" y="382">&#8226; Cleaning &amp; standardization</text>
    <text x="664" y="404">&#8226; Normalization &amp; enrichment</text>
    <text x="664" y="426">&#8226; Derived columns</text>
    <text x="664" y="448">&#8226; Referential integrity</text>
    <text x="664" y="470">&#8226; Deduplication</text>
  </g>
  <text x="776" y="508" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Object type</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="664" y="532">&#8226; Stored procedure output</text>
  </g>

  <path d="M 912 460 L 950 460" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 4: Gold -->
  <rect x="954" y="100" width="340" height="750" rx="10" fill="#FFFFFF" stroke="#D9A72C" stroke-width="2"/>
  <rect x="954" y="100" width="340" height="46" rx="10" fill="#D9A72C"/>
  <rect x="954" y="126" width="340" height="20" fill="#D9A72C"/>
  <text x="1124" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">GOLD LAYER</text>
  <text x="1124" y="174" text-anchor="middle" font-size="14" fill="#5F5E5A">Business-ready &#183; star schema</text>

  <rect x="972" y="194" width="304" height="230" rx="8" fill="#FBF3DD" stroke="#D9A72C" stroke-width="1.5"/>
  <text x="1124" y="220" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Conformed Dimensions (SCD2)</text>
  <g font-size="13.5" fill="#2B2A27">
    <text x="986" y="248">dim_date &#183; dim_product &#183; dim_store</text>
    <text x="986" y="268">dim_customer &#183; dim_employee</text>
    <text x="986" y="288">dim_supplier &#183; dim_account</text>
    <text x="986" y="308">dim_competitors &#183; dim_campaigns</text>
    <text x="986" y="332" font-weight="700">SCD2 bridges:</text>
    <text x="998" y="350">product_bridge, dim_store_bridge,</text>
    <text x="998" y="368">dim_supplier_bridge, employee_bridge</text>
    <text x="986" y="392" font-weight="700">Junk dims:</text>
    <text x="998" y="410">dim_sales_junk, customer_exp_junk</text>
  </g>

  <rect x="972" y="436" width="304" height="310" rx="8" fill="#FBF3DD" stroke="#D9A72C" stroke-width="1.5"/>
  <text x="1124" y="462" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Conformed Facts (atomic grain)</text>
  <g font-size="13.5" fill="#2B2A27">
    <text x="986" y="488">fact_sales</text>
    <text x="986" y="508">fact_inventory_snapshots</text>
    <text x="986" y="528">fact_inventory_movements</text>
    <text x="986" y="548">fact_purchase_order_fulfillment</text>
    <text x="986" y="568">fact_store_daily_financials</text>
    <text x="986" y="588">fact_gl_transactions</text>
    <text x="986" y="608">fact_customer_experience</text>
    <text x="986" y="628">fact_customer_loyalty</text>
    <text x="986" y="648">fact_gift_card_transactions</text>
    <text x="986" y="668">fact_marketing</text>
    <text x="986" y="688">fact_competitor_qtrly_performance</text>
    <text x="986" y="712" font-weight="700">Targets:</text>
    <text x="986" y="730">dim_sales_target, dim_finance_target,</text>
    <text x="986" y="748">dim_cx_target</text>
  </g>

  <path d="M 1298 460 L 1336 460" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 5: Power BI -->
  <rect x="1340" y="100" width="310" height="750" rx="10" fill="#FFFFFF" stroke="#378ADD" stroke-width="2"/>
  <rect x="1340" y="100" width="310" height="46" rx="10" fill="#378ADD"/>
  <rect x="1340" y="126" width="310" height="20" fill="#378ADD"/>
  <text x="1495" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">POWER BI</text>
  <text x="1495" y="174" text-anchor="middle" font-size="14" fill="#5F5E5A">Semantic model &#8594; Dashboards</text>

  <rect x="1358" y="194" width="274" height="196" rx="8" fill="#E8F1FC" stroke="#378ADD" stroke-width="1.5"/>
  <text x="1495" y="220" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Semantic Model</text>
  <g font-size="13.5" fill="#2B2A27">
    <text x="1372" y="246">&#8226; Galaxy schema relationships</text>
    <text x="1372" y="266">&#8226; 70+ DAX measures, 5 folders</text>
    <text x="1372" y="286">&#8226; Calculated columns</text>
    <text x="1372" y="306">&#8226; Bidirectional SCD2 bridges</text>
    <text x="1372" y="326">&#8226; dim_date marked date table</text>
    <text x="1372" y="346">&#8226; Target / benchmark compares</text>
    <text x="1372" y="366">&#8226; Kenyan public holiday calendar</text>
  </g>

  <rect x="1358" y="402" width="274" height="256" rx="8" fill="#E8F1FC" stroke="#378ADD" stroke-width="1.5"/>
  <text x="1495" y="428" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Dashboards</text>
  <g font-size="13.5" fill="#2B2A27">
    <text x="1372" y="454">1. Sales &amp; Profitability</text>
    <text x="1372" y="474">2. Inventory &amp; Supply Chain</text>
    <text x="1372" y="494">3. Store Financial Performance</text>
    <text x="1372" y="514">4. Customer Experience &amp; Loyalty</text>
    <text x="1372" y="534">5. Marketing &amp; Competitive Intel.</text>
    <text x="1495" y="564" text-anchor="middle" font-weight="700">Design philosophy</text>
    <text x="1372" y="588">&#8226; Inform, not report</text>
    <text x="1372" y="608">&#8226; Benchmarked KPIs</text>
    <text x="1372" y="628">&#8226; Driver decomposition</text>
    <text x="1372" y="648">&#8226; Exception-ranked views</text>
  </g>

  <rect x="1358" y="674" width="274" height="156" rx="8" fill="#FDECEA" stroke="#D85A30" stroke-width="1.5"/>
  <text x="1495" y="700" text-anchor="middle" font-size="15" font-weight="700" fill="#2B2A27">Known validation items</text>
  <g font-size="12.8" fill="#2B2A27">
    <text x="1372" y="724">&#8226; Inventory receipts vs.</text>
    <text x="1384" y="742">movements</text>
    <text x="1372" y="764">&#8226; Store expenses vs. GL</text>
    <text x="1384" y="782">movements</text>
    <text x="1372" y="804">&#8226; fact_sales vs. daily_financials</text>
    <text x="1384" y="822">(~80% gap, unresolved)</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#378ADD"/>
    </marker>
  </defs>

  <text x="840" y="872" text-anchor="middle" font-size="13" fill="#8A8778">Medallion architecture (Bronze/Silver/Gold) implemented in SQL Server &#183; Semantic modeling and reporting implemented in Power BI Desktop (PBIP)</text>
</svg>

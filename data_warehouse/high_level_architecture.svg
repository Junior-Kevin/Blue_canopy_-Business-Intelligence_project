<svg viewBox="0 0 1680 940" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1680" height="940" fill="#FAFAF8"/>

  <text x="840" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#2B2A27">Blue Canopy Business Intelligence — High-Level Architecture</text>
  <text x="840" y="68" text-anchor="middle" font-size="16" fill="#5F5E5A">On-premises SQL Server OLAP warehouse (Bronze / Silver / Gold) &#8594; Power BI semantic model &#8594; Dashboards</text>

  <!-- ============================================================ -->
  <!-- OLAP CONTAINER RECTANGLE (spans Bronze, Silver, Gold)         -->
  <!-- ============================================================ -->
  <rect x="326" y="88" width="980" height="826" rx="14"
        fill="#F5F2EC" fill-opacity="0.55"
        stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="816" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#4A4A4A" letter-spacing="2">OLAP</text>

  <!-- SQL Server logo (top-left of OLAP container) -->
  <g transform="translate(346, 100)">
    <!-- Logo mark: database cylinder -->
    <g>
      <ellipse cx="28" cy="12" rx="22" ry="8" fill="#E6462C"/>
      <path d="M6 12 V38 C6 44 50 44 50 38 V12 Z" fill="#B71C1C"/>
      <ellipse cx="28" cy="25" rx="22" ry="8" fill="#D32F2F"/>
      <path d="M6 25 V38 C6 44 50 44 50 38 V25 Z" fill="#B71C1C"/>
      <ellipse cx="28" cy="25" rx="22" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>
      <ellipse cx="28" cy="38" rx="22" ry="8" fill="#D32F2F"/>
      <path d="M6 38 V44 C6 50 50 50 50 44 V38 Z" fill="#B71C1C"/>
      <ellipse cx="28" cy="38" rx="22" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>
      <ellipse cx="28" cy="12" rx="22" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>
    </g>
    <text x="66" y="24" font-size="14" font-weight="700" fill="#4A4A4A">SQL Server</text>
    <text x="66" y="42" font-size="11.5" fill="#7A7A7A" font-style="italic">On-Premises (non-cloud)</text>
  </g>

  <!-- Column 1: Data Sources (outside OLAP) -->
  <rect x="30" y="100" width="260" height="760" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/>
  <rect x="30" y="100" width="260" height="46" rx="10" fill="#8A8778"/>
  <rect x="30" y="126" width="260" height="20" fill="#8A8778"/>
  <text x="160" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">OLTP DATA SOURCES</text>
  <text x="160" y="172" text-anchor="middle" font-size="14" fill="#5F5E5A">5 source systems</text>
  <text x="160" y="192" text-anchor="middle" font-size="14" fill="#5F5E5A">34 CSV files</text>

  <g font-size="15" fill="#2B2A27" font-weight="600">
    <rect x="48" y="212" width="224" height="42" rx="6" fill="#F0EFEA"/>
    <text x="60" y="238">CRM &amp; Loyalty (6)</text>
    <rect x="48" y="262" width="224" height="42" rx="6" fill="#F0EFEA"/>
    <text x="60" y="288">POS &amp; Ecommerce (5)</text>
    <rect x="48" y="312" width="224" height="42" rx="6" fill="#F0EFEA"/>
    <text x="60" y="338">Supply Chain &amp; Inventory (7)</text>
    <rect x="48" y="362" width="224" height="42" rx="6" fill="#F0EFEA"/>
    <text x="60" y="388">Stores &amp; HR (4)</text>
    <rect x="48" y="412" width="224" height="42" rx="6" fill="#F0EFEA"/>
    <text x="60" y="438">Marketing &amp; External (12)</text>
  </g>
  <text x="160" y="490" text-anchor="middle" font-size="13.5" fill="#8A8778">Python generators</text>
  <text x="160" y="508" text-anchor="middle" font-size="13.5" fill="#8A8778">(pandas, NumPy, Faker)</text>
  <text x="160" y="526" text-anchor="middle" font-size="13.5" fill="#8A8778">&#8594; raw CSVs</text>

  <path d="M 296 460 L 334 460" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 2: Bronze -->
  <rect x="338" y="140" width="260" height="750" rx="10" fill="#FFFFFF" stroke="#C9A876" stroke-width="2"/>
  <rect x="338" y="140" width="260" height="46" rx="10" fill="#B08D57"/>
  <rect x="338" y="166" width="260" height="20" fill="#B08D57"/>
  <text x="468" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">BRONZE LAYER</text>
  <text x="468" y="214" text-anchor="middle" font-size="14" fill="#5F5E5A">SQL Server &#183; raw data</text>

  <circle cx="468" cy="262" r="26" fill="#C9A876"/>

  <text x="468" y="316" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Purpose</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="356" y="340">&#8226; Audit trail / traceability</text>
    <text x="356" y="362">&#8226; Raw backup of source</text>
  </g>
  <text x="468" y="400" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Load</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="356" y="424">&#8226; Batch, full load</text>
    <text x="356" y="446">&#8226; No transformation</text>
  </g>
  <text x="468" y="484" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Object type</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="356" y="508">&#8226; Tables, as-received</text>
  </g>

  <path d="M 604 460 L 642 460" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 3: Silver -->
  <rect x="646" y="140" width="260" height="750" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/>
  <rect x="646" y="140" width="260" height="46" rx="10" fill="#8F8D87"/>
  <rect x="646" y="166" width="260" height="20" fill="#8F8D87"/>
  <text x="776" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">SILVER LAYER</text>
  <text x="776" y="214" text-anchor="middle" font-size="14" fill="#5F5E5A">SQL Server &#183; cleaned data</text>

  <circle cx="776" cy="262" r="26" fill="#B4B2A9"/>

  <text x="776" y="316" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Purpose</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="664" y="340">&#8226; Reliable foundation for</text>
    <text x="674" y="360">downstream analytics</text>
  </g>
  <text x="776" y="398" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Transformations</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="664" y="422">&#8226; Cleaning &amp; standardization</text>
    <text x="664" y="444">&#8226; Normalization &amp; enrichment</text>
    <text x="664" y="466">&#8226; Derived columns</text>
    <text x="664" y="488">&#8226; Referential integrity</text>
    <text x="664" y="510">&#8226; Deduplication</text>
  </g>
  <text x="776" y="548" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Object type</text>
  <g font-size="14.5" fill="#2B2A27">
    <text x="664" y="572">&#8226; Stored procedure output</text>
  </g>

  <path d="M 912 460 L 950 460" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 4: Gold -->
  <rect x="954" y="140" width="340" height="760" rx="10" fill="#FFFFFF" stroke="#D9A72C" stroke-width="2"/>
  <rect x="954" y="140" width="340" height="46" rx="10" fill="#D9A72C"/>
  <rect x="954" y="166" width="340" height="20" fill="#D9A72C"/>
  <text x="1124" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">GOLD LAYER</text>
  <text x="1124" y="214" text-anchor="middle" font-size="14" fill="#5F5E5A">Business-ready &#183; star schema</text>

  <!-- Conformed Dimensions box -->
  <rect x="972" y="232" width="304" height="240" rx="8" fill="#FBF3DD" stroke="#D9A72C" stroke-width="1.5"/>
  <text x="1124" y="258" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Conformed Dimensions (SCD2)</text>
  <g font-size="13.5" fill="#2B2A27">
    <text x="986" y="286">dim_date &#183; dim_product &#183; dim_store</text>
    <text x="986" y="306">dim_customer &#183; dim_employee</text>
    <text x="986" y="326">dim_supplier &#183; dim_account</text>
    <text x="986" y="346">dim_competitors &#183; dim_campaigns</text>
    <text x="986" y="372" font-weight="700">SCD2 bridges:</text>
    <text x="998" y="390">product_bridge, dim_store_bridge,</text>
    <text x="998" y="408">dim_supplier_bridge, employee_bridge</text>
    <text x="986" y="432" font-weight="700">Junk dims:</text>
    <text x="998" y="450">dim_sales_junk, customer_exp_junk</text>
  </g>

  <!-- Conformed Facts box (enlarged to fit all contents) -->
  <rect x="972" y="486" width="304" height="380" rx="8" fill="#FBF3DD" stroke="#D9A72C" stroke-width="1.5"/>
  <text x="1124" y="512" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Conformed Facts (atomic grain)</text>
  <g font-size="13.5" fill="#2B2A27">
    <text x="986" y="540">fact_sales</text>
    <text x="986" y="560">fact_inventory_snapshots</text>
    <text x="986" y="580">fact_inventory_movements</text>
    <text x="986" y="600">fact_purchase_order_fulfillment</text>
    <text x="986" y="620">fact_store_daily_financials</text>
    <text x="986" y="640">fact_gl_transactions</text>
    <text x="986" y="660">fact_customer_experience</text>
    <text x="986" y="680">fact_customer_loyalty</text>
    <text x="986" y="700">fact_gift_card_transactions</text>
    <text x="986" y="720">fact_marketing</text>
    <text x="986" y="740">fact_competitor_qtrly_performance</text>
    <text x="986" y="768" font-weight="700">Targets:</text>
    <text x="986" y="786">dim_sales_target, dim_finance_target,</text>
    <text x="986" y="804">dim_cx_target</text>
  </g>

  <path d="M 1298 520 L 1336 520" stroke="#378ADD" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 5: Power BI (outside OLAP) -->
  <rect x="1340" y="100" width="310" height="800" rx="10" fill="#FFFFFF" stroke="#378ADD" stroke-width="2"/>
  <rect x="1340" y="100" width="310" height="46" rx="10" fill="#378ADD"/>
  <rect x="1340" y="126" width="310" height="20" fill="#378ADD"/>
  <text x="1495" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">POWER BI</text>
  <text x="1495" y="174" text-anchor="middle" font-size="14" fill="#5F5E5A">Semantic model &#8594; Dashboards</text>

  <rect x="1358" y="194" width="274" height="196" rx="8" fill="#E8F1FC" stroke="#378ADD" stroke-width="1.5"/>
  <text x="1495" y="220" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Semantic Model</text>
  <g font-size="13.5" fill="#2B2A27">
    <text x="1372" y="246">&#8226; Galaxy schema relationships</text>
    <text x="1372" y="266">&#8226; 70+ DAX measures, 5 folders</text>
    <text x="1372" y="286">&#8226; Calculated columns</text>
    <text x="1372" y="306">&#8226; Bidirectional SCD2 bridges</text>
    <text x="1372" y="326">&#8226; dim_date marked date table</text>
    <text x="1372" y="346">&#8226; Target / benchmark compares</text>
    <text x="1372" y="366">&#8226; Kenyan public holiday calendar</text>
  </g>

  <rect x="1358" y="402" width="274" height="256" rx="8" fill="#E8F1FC" stroke="#378ADD" stroke-width="1.5"/>
  <text x="1495" y="428" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2B2A27">Dashboards</text>
  <g font-size="13.5" fill="#2B2A27">
    <text x="1372" y="454">1. Sales &amp; Profitability</text>
    <text x="1372" y="474">2. Inventory &amp; Supply Chain</text>
    <text x="1372" y="494">3. Store Financial Performance</text>
    <text x="1372" y="514">4. Customer Experience &amp; Loyalty</text>
    <text x="1372" y="534">5. Marketing &amp; Competitive Intel.</text>
    <text x="1495" y="564" text-anchor="middle" font-weight="700">Design philosophy</text>
    <text x="1372" y="588">&#8226; Inform, not report</text>
    <text x="1372" y="608">&#8226; Benchmarked KPIs</text>
    <text x="1372" y="628">&#8226; Driver decomposition</text>
    <text x="1372" y="648">&#8226; Exception-ranked views</text>
  </g>

  <rect x="1358" y="674" width="274" height="200" rx="8" fill="#FDECEA" stroke="#D85A30" stroke-width="1.5"/>
  <text x="1495" y="700" text-anchor="middle" font-size="15" font-weight="700" fill="#2B2A27">Known validation items</text>
  <g font-size="12.8" fill="#2B2A27">
    <text x="1372" y="724">&#8226; Inventory receipts vs.</text>
    <text x="1384" y="742">movements</text>
    <text x="1372" y="764">&#8226; Store expenses vs. GL</text>
    <text x="1384" y="782">movements</text>
    <text x="1372" y="804">&#8226; fact_sales vs. daily_financials</text>
    <text x="1384" y="822">(~80% gap, unresolved)</text>
    <text x="1372" y="850">&#8226; Snapshot vs. ledger</text>
    <text x="1384" y="868">reconciliation</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#378ADD"/>
    </marker>
  </defs>

  <text x="840" y="924" text-anchor="middle" font-size="13" fill="#8A8778">Medallion architecture (Bronze/Silver/Gold) implemented in on-premises SQL Server OLAP &#183; Semantic modeling and reporting implemented in Power BI Desktop (PBIP)</text>
</svg>